name: CodeQL

# What CodeQL sees:
# - Go: the module that `go build ./...` compiles (cmd/, internal/, tests/ui-fixture).
#   native/ and integration/*.go carry the `bifrost` build tag and import Bifrost packages that are
#   not in go.mod, so they are NOT analyzed; that needs a Bifrost checkout (see scripts/build-with-bifrost.sh).
#   Go cannot use build-mode none, and autobuild would run the Makefile's default target
#   (`check`: full tests and npm ci), so the build is explicit.
# - JavaScript/TypeScript: every .ts/.tsx/.js/.cjs file, without a build (ui/, scripts/, tests/).
# Python scripts, probes and the workflow files themselves are not analyzed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
