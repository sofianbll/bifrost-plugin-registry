# Merge Dependabot's grouped npm and docker updates once every check on the pull request has passed.
#
# dependabot.yml groups minor and patch updates only, so a pull request outside a group is a major or a security
# update; it stays open. So does the github-actions group: merging a change to .github/workflows needs the
# `workflows` permission, which a job token cannot hold. The weekly maintenance pass (docs/agents/maintenance.md)
# handles what is left. A group is recognized by its title, which reads "the npm group" or "the docker group"
# whether it holds one update ("Bump alpine from … in the docker group …") or several ("Bump the npm group …").
#
# Each listed workflow that completes for a Dependabot pull request re-reads every check run of the head commit;
# the last one to finish merges. Nothing from the pull request is checked out or run. A merge made with
# GITHUB_TOKEN starts no workflow on main.
name: Dependabot merge

on:
  workflow_run:
    workflows: [CI, CodeQL, Docs, E2E, Qualify]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr view "$BRANCH" --json number,state,headRefOid,title \
            --jq "select(.state == \"OPEN\" and .headRefOid == \"$SHA\" and (.title | test(\"the (npm|docker) group\"))) | .number")
          [[ -n $pr ]] || { echo "::notice::$BRANCH: no open npm or docker group at $SHA"; exit 0; }
          left=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not))] | length')
          (( left == 0 )) || { echo "::notice::#$pr: $left check(s) still running or not passed"; exit 0; }
          gh pr merge "$pr" --merge --match-head-commit "$SHA"
